{% extends 'base.html' %}
{% block title %}Nuevo post{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <a href="{{ url_for('community') }}" class="text-sm text-[#71717a] hover:text-[#18181b] mb-4 inline-flex items-center gap-1">← Volver</a>
  <h1 class="text-xl font-bold text-[#18181b] mt-3 mb-6">✏️ Crear post</h1>
  <div class="bg-white border border-[#e4e4e7] rounded-xl p-6 shadow-sm">
    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-[#52525b] mb-1.5">Categoría</label>
        <select name="category_id" class="input">
          <option value="">Sin categoría</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}">{{ cat.emoji }} {{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#52525b] mb-1.5">Título</label>
        <input type="text" name="title" class="input" placeholder="¿De qué trata tu post?" required maxlength="200"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#52525b] mb-1.5">Contenido</label>
        <textarea name="content" class="input" rows="8" placeholder="Escribe tu mensaje aquí..." required></textarea>
      </div>
      <div class="flex gap-3 justify-end">
        <a href="{{ url_for('community') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Publicar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
