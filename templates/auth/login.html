<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Iniciar sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0f0f0f;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .input{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:11px 14px;color:#e2e8f0;font-size:14px;width:100%;outline:none;box-sizing:border-box;}
  .input:focus{border-color:#6366f1;}
</style>
</head>
<body class="p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <p class="text-4xl mb-3">🎓</p>
    <h1 class="text-2xl font-bold text-white">Mi Academia</h1>
    <p class="text-[#6b7280] text-sm mt-1">Inicia sesión para continuar</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for cat, msg in messages %}
    <div class="px-4 py-3 rounded-lg text-sm {% if cat=='error' %}bg-red-950 border border-red-800 text-red-300{% else %}bg-green-950 border border-green-800 text-green-300{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="bg-[#161616] border border-[#252525] rounded-2xl p-8">
    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Email</label>
        <input type="email" name="email" class="input" placeholder="tu@email.com" required autofocus/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Contraseña</label>
        <input type="password" name="password" class="input" placeholder="••••••••" required/>
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition text-sm mt-2">
        Iniciar sesión
      </button>
    </form>
    <p class="text-center text-sm text-[#6b7280] mt-5">
      ¿No tienes cuenta?
      <a href="{{ url_for('register') }}" class="text-indigo-400 hover:text-indigo-300 font-medium">Regístrate</a>
    </p>
  </div>
</div>
</body>
</html>
