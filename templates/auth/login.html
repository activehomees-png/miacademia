<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Iniciar sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#f4f4f5;color:#18181b;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .input{background:#fff;border:1px solid #d4d4d8;border-radius:8px;padding:11px 14px;color:#18181b;font-size:14px;width:100%;outline:none;box-sizing:border-box;}
  .input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.1);}
</style>
</head>
<body class="p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-violet-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">🎓</div>
    <h1 class="text-2xl font-bold text-[#18181b]">Marca Atractora</h1>
    <p class="text-[#71717a] text-sm mt-1">Inicia sesión para continuar</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for cat, msg in messages %}
    <div class="px-4 py-3 rounded-lg text-sm border {% if cat=='error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-green-50 border-green-200 text-green-700{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <div class="bg-white border border-[#e4e4e7] rounded-2xl p-8 shadow-sm">
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-[#52525b] mb-1.5">Email</label>
        <input type="email" name="email" class="input" placeholder="tu@email.com" required autofocus/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#52525b] mb-1.5">Contraseña</label>
        <input type="password" name="password" class="input" placeholder="••••••••" required/>
      </div>
      <button type="submit"
        class="w-full bg-violet-600 hover:bg-violet-700 text-white font-semibold py-3 rounded-lg transition text-sm mt-2">
        Iniciar sesión
      </button>
    </form>
    <p class="text-center text-sm text-[#71717a] mt-5">
      ¿No tienes cuenta?
      <a href="{{ url_for('register') }}" class="text-violet-600 hover:text-violet-700 font-semibold">Regístrate</a>
    </p>
  </div>
</div>
</body>
</html>
