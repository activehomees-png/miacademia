{% extends 'base.html' %}
{% block title %}Nueva clase en directo{% endblock %}

{% block content %}
<div class="max-w-lg">
  <a href="{{ url_for('admin_live_classes') }}" class="text-sm text-[#6b7280] hover:text-white mb-4 inline-flex items-center gap-1">← Volver</a>
  <h1 class="text-xl font-bold text-white mt-3 mb-6">📅 Programar clase en directo</h1>
  <div class="card p-6">
    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Título *</label>
        <input type="text" name="title" class="input" placeholder="Ej: Sesión de preguntas y respuestas" required/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Descripción</label>
        <textarea name="description" class="input" rows="3" placeholder="De qué va la sesión..."></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Fecha y hora *</label>
        <input type="datetime-local" name="scheduled_at" class="input" required/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Duración (minutos)</label>
        <input type="number" name="duration" class="input" value="60" min="5"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Instructor</label>
        <input type="text" name="instructor" class="input" placeholder="Nombre del profesor"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#9ca3af] mb-1.5">Enlace de reunión (Meet, Zoom...)</label>
        <input type="url" name="meet_url" class="input" placeholder="https://meet.google.com/..."/>
      </div>
      <div class="flex gap-3 justify-end pt-2">
        <a href="{{ url_for('admin_live_classes') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Programar clase</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
